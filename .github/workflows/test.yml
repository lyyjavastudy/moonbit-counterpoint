name: Check and Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: MoonBit (${{ matrix.os }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install MoonBit on Unix
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install MoonBit on Windows
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Toolchain information
        shell: bash
        run: |
          moon version --all
          moon update
      - name: Enforce MoonBit compiler floor on Unix
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          version="$(moonc -v | sed -n 's/^v\([0-9.]*\).*/\1/p')"
          test -n "$version"
          awk -F. '($1 > 0) || ($1 == 0 && $2 > 10) || ($1 == 0 && $2 == 10 && $3 >= 9) { ok=1 } END { if (ok) exit 0; exit 1 }' <<< "$version"
      - name: Enforce MoonBit compiler floor on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $versionText = (moonc --version | Out-String).Trim()
          if ($versionText -notmatch 'v([0-9]+)\.([0-9]+)\.([0-9]+)') {
            throw "Unable to parse MoonBit compiler version: $versionText"
          }
          $major = [int]$Matches[1]
          $minor = [int]$Matches[2]
          $patch = [int]$Matches[3]
          if (($major -eq 0) -and (($minor -lt 10) -or (($minor -eq 10) -and ($patch -lt 9)))) {
            throw "MoonBit compiler $versionText is below the supported floor 0.10.9"
          }
      - name: Check all targets
        run: moon check --target all
      - name: Test all targets
        run: moon test --target all
      - name: Verify formatting
        run: |
          moon fmt
          git diff --exit-code
      - name: Verify generated interfaces
        run: |
          moon info
          git diff --exit-code
      - name: Coverage summary
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          moon test --target native --enable-coverage
          moon coverage report -f summary
          moon coverage analyze
